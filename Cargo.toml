[package]
name = "gray-git-flow"
version = "0.1.0"
edition = "2024"
description = "Merged git-lifecycle plugin for the gray agent harness: checkpoint, autocommit, git-merge, review in one sidecar."
license = "MIT"

[[bin]]
name = "git-flow"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[profile.release]
strip = true

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
